<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>담임 검토 · 정왕고 체험학습 작성기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 담임이 빠르게 훑고 결정하는 업무 화면
   IDEA: 결재함(받은 서류 목록 + 펼친 서류 + 결재란)
   PICTURE: 오른쪽에 학생이 보낸 원본 양식 PDF
   COLOUR and TYPE: 학생 앱과 같은 짙은 초록 #1f4d3a, 보완 주황, 승인 초록 / Noto Sans KR
   LAYOUT: 왼쪽 목록, 오른쪽 서류와 결재. 900px 이하에서는 쌓기 */
:root{color-scheme:light dark;--bg:light-dark(#f3f5f2,#141816);--card:light-dark(#fff,#1d2320);--ink:light-dark(#1b221e,#e7ece9);--mute:light-dark(#5d6a63,#9aa8a0);--line:light-dark(#d9dfdb,#33403a);--g:#1f4d3a;--gt:light-dark(#1f6b45,#8fdcb0);--g2:light-dark(#e3efe8,#22392e);--warn:#d9731e;--ok:#2e8b57}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip}
header{background:var(--g);color:#fff;padding:16px max(4vw,16px);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:clamp(20px,2.6vw,26px);line-height:1.2}
header span{opacity:.85;font-size:14px}
main{max-width:none;margin:auto;padding:20px max(2vw,16px) 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:13px;color:var(--mute)}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:light-dark(#fff,#111513);color:var(--ink);min-height:44px;margin-top:3px}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:1px}
.btn{border:1px solid var(--g);background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:500;border-radius:9px;padding:8px 14px;min-height:44px;cursor:pointer}
.btn.p{background:var(--g);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.fix{background:var(--warn);border-color:var(--warn);color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
#login{max-width:440px;margin:40px auto}
#login .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0 12px;color:var(--ink)}
.check input{width:20px;height:20px;min-height:0;margin:0}
#app{display:grid;grid-template-columns:minmax(380px,1fr) var(--dw,minmax(0,1.6fr));gap:20px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tools a{display:inline-flex;align-items:center;text-decoration:none;border:1px solid var(--gt);background:var(--card);color:var(--gt);font-weight:700;border-radius:999px;padding:6px 12px;font-size:13.5px;min-height:36px;box-sizing:border-box}
.tools button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer;min-height:36px}
.tools button.on{background:var(--g2);border-color:var(--g)}
#list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 230px);overflow:auto}
.it{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink);width:100%}
.it.on{border-color:var(--g);box-shadow:0 0 0 2px var(--g2)}
.it .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.it .s{font-size:13px;color:var(--mute);margin-top:2px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;color:#fff;background:#6b7a72;white-space:nowrap}
.badge.ok{background:var(--ok)}.badge.fix{background:var(--warn)}
#detail .pdf{width:100%;height:78vh;border:1px solid var(--line);border-radius:10px;background:#fff}
#detail .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
#detail h2{margin:0;font-size:20px}
.dec{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;position:sticky;bottom:0;z-index:5;background:var(--card);padding:12px 0;border-top:1px solid var(--line)}
.dec .btn{min-height:52px;font-size:17px;font-weight:700;padding:10px 26px}
.dec .btn.ok,.dec .btn.fix{min-width:130px}
.edlog{margin:0 0 10px;font-size:14px}.edlog pre{white-space:pre-wrap;font:inherit;margin:6px 0 0;padding:8px 10px;border-radius:8px;background:light-dark(#fff6e0,#3a3018)}
.dayh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 2px 6px;font-weight:800;font-size:14px;color:var(--gt);border-bottom:2px solid var(--gt);padding-bottom:3px}
.cpy{font:inherit;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--gt);background:transparent;color:var(--gt);cursor:pointer}
.rov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:12px}
.rbox{background:var(--card,#fff);color:var(--ink,#111);width:min(640px,100%);max-height:88vh;border-radius:14px;display:flex;flex-direction:column}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line,#ddd)}
.rbody{overflow-y:auto;padding:4px 16px 16px}.rbody h4{margin:14px 0 6px;color:var(--gt)}.rbody small{color:#888;font-weight:400}
.rbody table{width:100%;border-collapse:collapse;font-size:14px}.rbody td{padding:6px 6px;border-bottom:1px solid var(--line,#e5e5e5)}.rbody td:first-child{width:52px;color:#888}
.tnote{white-space:pre-line;background:#e6f4ea;color:#1e6b3a;border-radius:10px;padding:10px 12px;font-weight:700;margin:0 0 10px}
.btn.del{color:#c5221f;border-color:#e8a29d}
.btn.ok.done{background:transparent!important;color:var(--gt)!important;border:2px solid var(--gt)!important}
.topdec{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.topdec .badge{flex:none}.topdec .btn{min-height:44px;font-size:15px;font-weight:700;padding:8px 18px}
.empty{color:var(--mute);text-align:center;padding:60px 10px}
#msg{min-height:1.4em;font-size:14px;color:var(--gt);margin:6px 0}
:root[data-theme=dark] #msg{color:#8fd1ae}
.err{color:#e2553f!important}
#pages{display:flex;flex-direction:column;gap:12px}
.pgsticky{}
@media(min-width:901px){#app>div:first-child{position:sticky;top:12px;align-self:start}}
.pg{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;width:min(100%,var(--pw,100%));margin:0 auto}
.pg canvas{display:block;width:100%;height:auto}
.hl{position:absolute;background:rgba(255,40,40,.30);outline:2px solid rgba(215,0,0,.85);border-radius:2px;mix-blend-mode:multiply;pointer-events:none}
.hl.w{background:rgba(255,170,0,.32);outline-color:rgba(220,130,0,.9)}
.hl.flash{animation:fl .9s 2}
@keyframes fl{50%{background:rgba(255,40,40,.7)}}
.nohl .hl{display:none}
.audit{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:light-dark(#fff,#151a17)}
.audit h3{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.audit ul{list-style:none;margin:0;padding:0}
.audit li{display:flex;gap:8px;padding:4px 0;font-size:14.5px;cursor:pointer}
.audit li b{flex:none;border-radius:6px;font-size:12px;padding:2px 7px;color:#fff;background:#d7261e;height:fit-content}
.audit li.w b{background:#d99a1e}.audit li.i b{background:#6b7a72}
.audit .okmsg{color:var(--ok);font-weight:700}
.prev{margin-top:8px;padding:8px 10px;border-radius:8px;background:light-dark(#fff4e8,#3a2a19);font-size:14px;white-space:pre-wrap}
#back{display:none}
@media(max-width:900px){#app{grid-template-columns:minmax(0,1fr)}#list{max-height:none}#detail .pdf{height:70vh}
  #app:not(.showd) #detail-wrap{display:none}#app.showd>div:first-child{display:none}
  #back{display:inline-flex;align-items:center;margin-bottom:10px}
  #detail{padding:12px}main{padding:12px 10px 60px}
  .dec .btn{font-size:15px;padding:8px 10px;min-height:46px;flex:1 1 0;min-width:0!important}.dec{gap:8px}}
</style>
<script>(function(){var u=navigator.userAgent||'';if(/KAKAOTALK/i.test(u)&&!/[?&]inapp=1/.test(location.search)){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href)}})();</script>
</head>
<body>
<header><h1>담임 검토 · 정왕고 체험학습 작성기</h1><span id="who"></span></header>
<main>
  <section id="login" class="card">
    <h2 style="margin:0 0 10px;font-size:20px">담임 로그인</h2>
    <div class="row"><label>학년<select id="lg"><option>1</option><option>2</option><option selected>3</option></select></label><label>반<input id="lc" inputmode="numeric" placeholder="예: 8"></label></div>
    <label style="margin-bottom:12px">담임 비밀번호<input id="lp" type="password" autocomplete="current-password"></label>
    <button class="btn p" id="bLogin" style="width:100%">로그인</button>
    <p id="lmsg" style="font-size:14px;min-height:1.4em"></p>
    <p style="font-size:13px;color:var(--mute);margin:0">비밀번호는 검토 시트 '설정' 탭에 반별로 적어 둔 것입니다.</p>
  </section>
  <section id="app" hidden>
    <div>
      <div class="tools" id="filters"></div>
      <div class="tools"><button id="bRefresh">새로고침</button><a id="bCC" href="https://class-calendar-beryl.vercel.app" target="_blank" rel="noopener">📅 쉬운출결 열기</a><button id="bLogout">로그아웃</button></div>
      <div id="msg"></div>
      <div id="list"></div>
    </div>
    <div id="detail-wrap"><button class="btn" id="back" type="button">← 목록으로</button><div id="detail" class="card"><p class="empty">왼쪽 목록에서 학생의 요청을 고르세요.</p></div></div>
  </section>
</main>
<script src="config.js"></script>
<script src="spec.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
{
const API=(window.JW_API||'').trim();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cred=null,items=[],cur=null,filter='대기',pdfUrl='',curData={},pdfBytes=null,lastAudit=null,pageEls=[];
const say=(m,bad)=>{$('#msg').textContent=m;$('#msg').classList.toggle('err',!!bad)};
async function api(o){
  if(!API)throw new Error('검토 서버 주소(config.js)가 설정되지 않았습니다.');
  let r;for(let k=0;;k++){try{r=await fetch(API,{method:'POST',body:JSON.stringify(o)});break}catch(e){if(k>=1)throw new Error('서버에 연결하지 못했어요. 인터넷(와이파이·데이터) 연결을 확인하고 다시 눌러 주세요.');await new Promise(z=>setTimeout(z,1500))}}
  let j;try{j=await r.json()}catch(e){throw new Error('서버 응답을 읽지 못했어요. 잠시 후 다시 시도하세요.')}if(!j.ok)throw new Error(j.msg||'요청 실패');return j;
}
const badge=s=>`<span class="badge ${s==='승인'?'ok':s==='보완 요청'?'fix':''}">${esc(s)}</span>`;
const FIL=[['대기','검토 대기',x=>/대기/.test(x.status)],['보완','보완 요청',x=>x.status==='보완 요청'],['승인','승인',x=>x.status==='승인'],['전체','전체',()=>true]];
function drawFilters(){
  $('#filters').innerHTML=FIL.map(([k,l,f])=>`<button data-f="${k}" class="${filter===k?'on':''}">${l} ${items.filter(f).length}</button>`).join('');
}
const WDK='일월화수목금토';
function dayLabel(k){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(k);if(!m)return k||'날짜 없음';const t=new Date(+m[1],+m[2]-1,+m[3]);return `${+m[2]}/${+m[3]}(${WDK[t.getDay()]})`}
function groupByDay(L){const g={};L.forEach(x=>{const k=String(x.at||'').slice(0,10);(g[k]=g[k]||[]).push(x)});
  return Object.keys(g).sort().reverse().map(k=>[k,g[k].sort((a,b)=>(+a.num||0)-(+b.num||0)||String(a.doc).localeCompare(String(b.doc)))])}
const TERMS=window.JW_TERMS||[];
const startOfP=x=>(String(x.period||'').match(/\d{4}-\d{2}-\d{2}/)||[''])[0];
const mdS=v=>{const m=/^\d{4}-(\d{2})-(\d{2})/.exec(v||'');return m?`${+m[1]}/${+m[2]}`:''};
function termOf(x){const st=startOfP(x);const t=TERMS.find(t=>st>=t.s&&st<=t.e);return t?`${t.n} (${mdS(t.s)}~${mdS(t.e)})`:'자유 기간'}
function groupByTerm(L){const order=[...TERMS.map(t=>`${t.n} (${mdS(t.s)}~${mdS(t.e)})`),'자유 기간'],g={};
  L.forEach(x=>{const k=termOf(x);(g[k]=g[k]||[]).push(x)});
  return order.filter(k=>g[k]).map(k=>[k,g[k].sort((a,b)=>(+a.num||0)-(+b.num||0)||startOfP(a).localeCompare(startOfP(b))||String(a.doc).localeCompare(String(b.doc)))])}
function termText(k,a){const seen=new Set();const L=a.filter(x=>x.doc==='신청서'||!a.some(y=>y.num===x.num&&y.doc==='신청서')).filter(x=>!seen.has(x.num)&&seen.add(x.num));
  return `✅ ${k} 체험학습 승인 명단 (${L.length}명)\n`+L.map(x=>`${x.num}번 ${x.name}`).join('\n')}
async function copyText(t,btn){try{await navigator.clipboard.writeText(t)}catch(err){const ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove()}
  if(btn){const o=btn.textContent;btn.textContent='복사됨 ✔';setTimeout(()=>btn.textContent=o,1500)}}
function roster(){ // 요청 날짜별 승인 명단(번호순) — 학생 공지용
  const G=groupByTerm(items.filter(x=>x.status==='승인'));
  const txt=G.map(([k,a])=>`[${k}]\n`+a.map(x=>`${x.num}번 ${x.name} · ${x.doc} · ${String(x.period||'').replace(/(\d{4})-(\d{2})-(\d{2})/g,(m,y,mo,da)=>`${+mo}/${+da}`)}`).join('\n')).join('\n\n');
  const head=`✅ 교외체험학습 승인 명단 (${$('#who').textContent||''})`;
  const ov=document.createElement('div');ov.className='rov';
  ov.innerHTML=`<div class="rbox"><div class="rh"><b>${esc(head)}</b><span><button class="btn" id="rCopy">텍스트 복사</button> <button class="btn" id="rClose">닫기</button></span></div>
  <div class="rbody">${G.map(([k,a],gi)=>`<h4>${esc(k)} <small>${a.length}건</small> <button class="cpy" data-rc="${gi}">📋 이 텀 명단 복사</button></h4><table>${a.map(x=>`<tr><td>${esc(x.num)}번</td><td><b>${esc(x.name)}</b></td><td>${esc(x.doc)}</td><td>${esc(x.period)}</td></tr>`).join('')}</table>`).join('')||'<p>승인된 서류가 없어요.</p>'}</div></div>`;
  document.body.append(ov);
  ov.onclick=e=>{if(e.target===ov||e.target.id==='rClose')ov.remove();const b=e.target.closest('[data-rc]');if(b){const [k,a]=G[+b.dataset.rc];copyText(termText(k,a),b)}};
  ov.querySelector('#rCopy').onclick=async e=>{const t=head+'\n\n'+txt;try{await navigator.clipboard.writeText(t);e.target.textContent='복사됨 ✔'}catch(err){const ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();e.target.textContent='복사됨 ✔'}};
}
function drawList(){
  drawFilters();
  const f=FIL.find(x=>x[0]===filter)[2];let L=items.filter(f);
  const card=x=>`<button class="it ${cur&&cur.id===x.id?'on':''}" data-id="${esc(x.id)}"><div class="t"><b>${esc(x.grade)}-${esc(x.cls)} ${esc(x.num)}번 ${esc(x.name)}</b>${badge(x.status)}</div>
    <div class="s">${esc(x.doc)} · ${esc(x.period)}${x.dest?` · ${esc(x.dest)}`:''}</div><div class="s">요청 ${esc(x.at)}${x.count>1?` (${esc(x.count)}번째)`:''}</div></button>`;
  if(!L.length){$('#list').innerHTML='<p class="empty">해당하는 요청이 없어요.</p>';return}
  if(filter==='전체'){const P=x=>/대기/.test(x.status)?0:x.status==='보완 요청'?1:2;L=[...L].sort((a,b)=>P(a)-P(b)||String(b.at).localeCompare(String(a.at)))}
  if(filter!=='승인'){$('#list').innerHTML=L.map(card).join('');return}
  const G=groupByTerm(L);
  $('#list').innerHTML=`<button class="btn ok" id="bRoster" style="width:100%;margin-bottom:8px">📋 승인 명단 보기 (학생 공지용)</button>`+G.map(([k,a],gi)=>`<div class="dayh"><span>${esc(k)} · ${a.length}건</span><button class="cpy" data-cpy="${gi}">📋 명단 복사</button></div>${a.map(card).join('')}`).join('');
  document.querySelectorAll('[data-cpy]').forEach(b=>b.onclick=e=>{e.stopPropagation();const [k,a]=G[+b.dataset.cpy];copyText(termText(k,a),b)});
  $('#bRoster').onclick=roster;
}
async function load(){
  say('불러오는 중…');
  try{const j=await api({action:'tlist',...cred});items=j.list;$('#who').textContent=j.who;drawList();say(`요청 ${items.length}건`)}
  catch(e){say(e.message,true)}
}
async function open(id){
  cur=items.find(x=>x.id===id);drawList();$('#app').classList.add('showd');window.scrollTo(0,0);
  $('#detail').innerHTML='<p class="empty">서류를 불러오는 중…</p>';
  try{
    const j=await api({action:'tget',...cred,id});cur=j.item;
    if(pdfUrl)URL.revokeObjectURL(pdfUrl);pdfUrl='';
    if(j.pdf){const b=Uint8Array.from(atob(j.pdf),c=>c.charCodeAt(0));pdfUrl=URL.createObjectURL(new Blob([b],{type:'application/pdf'}))}
    const fn=`${cur.doc}_${cur.grade}-${cur.cls}-${cur.num}_${cur.name}.pdf`;
    $('#detail').innerHTML=`<div class="head"><div><h2>${esc(cur.grade)}-${esc(cur.cls)} ${esc(cur.num)}번 ${esc(cur.name)} · ${esc(cur.doc)}</h2>
      <div style="font-size:14px;color:var(--mute)">${esc(cur.period)}${cur.dest?` · ${esc(cur.dest)}`:''} · 요청 ${esc(cur.at)}</div></div><div class="topdec">${badge(cur.status)}<button class="btn ok${cur.status==='승인'?' done':''}" id="bOk2">${cur.status==='승인'?'✔ 승인됨 · 다시 전송':'✔ 승인 및 쉬운출결앱으로 전송'}</button><button class="btn fix" id="bFix2">보완 요청 쓰기</button><button class="btn" id="bEdit">✏️ 내용 직접 수정</button><button class="btn" id="bPin">🔑 비밀번호 초기화</button><button class="btn del" id="bDel">🗑 삭제</button></div></div>

async function delItem(){
  const x=cur;if(!x)return;
  const ok=window.confirm(`${x.grade}-${x.cls} ${x.num}번 ${x.name} 학생의 ${x.doc}(${x.period})를 삭제할까요?\n\n· 학생 보관함에서도 사라지고 되돌릴 수 없어요.\n· 학생은 처음부터 다시 써서 보내야 해요.${x.status==='승인'?'\n· 이미 쉬운출결로 보낸 기록은 쉬운출결에서 따로 지워 주세요.':''}`);
  if(!ok)return;
  try{await api({action:'tdelete',...cred,id:x.id});cur=null;await load();$('#app').classList.remove('showd');
    $('#detail').innerHTML=`<div class="empty"><div style="font-size:40px">🗑</div><b style="font-size:18px;color:var(--ink)">${esc(x.name)} 학생 ${esc(x.doc)} 삭제 완료</b><br>왼쪽 목록에서 다음 학생을 고르세요.</div>`;say(`${x.name} 학생 ${x.doc}를 삭제했어요`)}
  catch(e){say('❌ '+(/알 수 없는 요청/.test(e.message)?'삭제 기능을 쓰려면 Apps Script를 새 버전으로 배포해 주세요.':e.message))}
}
async function review(st){
  const cm=$('#cm').value.trim();
  if(st==='보완 요청'&&!cm){$('#cm').focus();say('보완할 내용을 적어 주세요.',true);return}
  $('#bOk').disabled=$('#bFix').disabled=$('#bOk2').disabled=true;say('저장하는 중…');
  try{const rv=await api({action:'treview',...cred,id:cur.id,status:st,comment:cm});const nm=cur.name;cur=null;await load();doneView(nm,st);const sy=syncMsg(rv.sync);say(`${nm} 학생: ${st} 처리했어요${sy}. 학생은 내 보관함에서 확인합니다.`,rv.sync&&!rv.sync.ok&&!rv.sync.off)}
  catch(e){say(e.message,true);$('#bOk').disabled=$('#bFix').disabled=$('#bOk2').disabled=false}
}
function doneView(nm,st){ // 처리 후 목록으로 돌아가기
  $('#app').classList.remove('showd');window.scrollTo(0,0);
  const nx=items.find(x=>/대기/.test(x.status));
  $('#detail').innerHTML=`<div class="empty"><div style="font-size:40px">${st==='승인'?'✅':'📝'}</div><b style="font-size:18px;color:var(--ink)">${esc(nm)} 학생 ${esc(st)} 완료</b><br>왼쪽 목록에서 다음 학생을 고르세요.${nx?`<br><button class="btn ok" id="bNext" style="margin-top:14px">다음 검토 대기: ${esc(nx.name)} 열기</button>`:''}</div>`;
  if(nx)$('#bNext').onclick=()=>open(nx.id);
}
$('#filters').addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;drawList()}});
$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)open(b.dataset.id)});
$('#bRefresh').onclick=load;
$('#back').onclick=()=>{$('#app').classList.remove('showd');window.scrollTo(0,0)};
$('#bLogout').onclick=()=>{try{sessionStorage.removeItem('jw-t');localStorage.removeItem('jw-t')}catch(e){}location.href='./'};
async function login(c){
  $('#lmsg').textContent='확인하는 중…';$('#lmsg').className='';
  try{const j=await api({action:'tlist',...c});cred=c;try{localStorage.setItem('jw-t',JSON.stringify(c))}catch(e){}
    $('#login').hidden=true;$('#app').hidden=false;items=j.list;$('#who').textContent=j.who;drawList();say(`요청 ${items.length}건`);
    const op=new URLSearchParams(location.search).get('open');if(!op){let m='';try{m=sessionStorage.getItem('jw-tmsg')||'';sessionStorage.removeItem('jw-tmsg')}catch(e){}if(m){say(m.split('\n')[0]);const nx=items.find(x=>/대기/.test(x.status));$('#detail').innerHTML=`<p class="tnote">${esc(m)}</p><div class="empty">왼쪽 목록에서 다음 학생을 고르세요.${nx?`<br><button class="btn ok" id="bNext" style="margin-top:14px">다음 검토 대기: ${esc(nx.name)} 열기</button>`:''}</div>`;if(nx)$('#bNext').onclick=()=>open(nx.id)}}if(op&&items.some(x=>x.id===op)){history.replaceState(null,'','teacher.html');await open(op);let m='';try{m=sessionStorage.getItem('jw-tmsg')||'';sessionStorage.removeItem('jw-tmsg')}catch(e){}if(m){say(m);const n=document.createElement('p');n.className='tnote';n.textContent=m;$('#detail').prepend(n)}}}
  catch(e){$('#lmsg').textContent=e.message;$('#lmsg').className='err';$('#login').hidden=false;$('#app').hidden=true}
}
$('#bLogin').onclick=()=>login({grade:$('#lg').value,cls:$('#lc').value.trim(),tpw:$('#lp').value});
$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')$('#bLogin').click()});
try{const c=JSON.parse(localStorage.getItem('jw-t')||sessionStorage.getItem('jw-t')||'null');if(c)login(c)}catch(e){}
if(!API){$('#lmsg').textContent='검토 서버 주소가 아직 설정되지 않았습니다(config.js).';$('#lmsg').className='err'}
}
</script>
</body>
</html>
