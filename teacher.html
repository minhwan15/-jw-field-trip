<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>담임 검토 · 정왕고 체험학습 작성기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 담임이 빠르게 훑고 결정하는 업무 화면
   IDEA: 결재함(받은 서류 목록 + 펼친 서류 + 결재란)
   PICTURE: 오른쪽에 학생이 보낸 원본 양식 PDF
   COLOUR and TYPE: 학생 앱과 같은 짙은 초록 #1f4d3a, 보완 주황, 승인 초록 / Noto Sans KR
   LAYOUT: 왼쪽 목록, 오른쪽 서류와 결재. 900px 이하에서는 쌓기 */
:root{color-scheme:light dark;--bg:light-dark(#f3f5f2,#141816);--card:light-dark(#fff,#1d2320);--ink:light-dark(#1b221e,#e7ece9);--mute:light-dark(#5d6a63,#9aa8a0);--line:light-dark(#d9dfdb,#33403a);--g:#1f4d3a;--g2:light-dark(#e3efe8,#22392e);--warn:#d9731e;--ok:#2e8b57}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip}
header{background:var(--g);color:#fff;padding:16px max(4vw,16px);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:clamp(20px,2.6vw,26px);line-height:1.2}
header span{opacity:.85;font-size:14px}
main{max-width:1400px;margin:auto;padding:20px max(4vw,16px) 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:13px;color:var(--mute)}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:light-dark(#fff,#111513);color:var(--ink);min-height:44px;margin-top:3px}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:1px}
.btn{border:1px solid var(--g);background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:500;border-radius:9px;padding:8px 14px;min-height:44px;cursor:pointer}
.btn.p{background:var(--g);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.fix{background:var(--warn);border-color:var(--warn);color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
#login{max-width:440px;margin:40px auto}
#login .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0 12px;color:var(--ink)}
.check input{width:20px;height:20px;min-height:0;margin:0}
#app{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tools button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer;min-height:36px}
.tools button.on{background:var(--g2);border-color:var(--g)}
#list{display:flex;flex-direction:column;gap:8px;max-height:75vh;overflow:auto}
.it{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink);width:100%}
.it.on{border-color:var(--g);box-shadow:0 0 0 2px var(--g2)}
.it .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.it .s{font-size:13px;color:var(--mute);margin-top:2px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;color:#fff;background:#6b7a72;white-space:nowrap}
.badge.ok{background:var(--ok)}.badge.fix{background:var(--warn)}
#detail .pdf{width:100%;height:78vh;border:1px solid var(--line);border-radius:10px;background:#fff}
#detail .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
#detail h2{margin:0;font-size:20px}
.dec{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;position:sticky;bottom:0;z-index:5;background:var(--card);padding:12px 0;border-top:1px solid var(--line)}
.dec .btn{min-height:52px;font-size:17px;font-weight:700;padding:10px 26px}
.dec .btn.ok,.dec .btn.fix{min-width:130px}
.topdec{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.topdec .badge{flex:none}.topdec .btn{min-height:44px;font-size:15px;font-weight:700;padding:8px 18px}
.empty{color:var(--mute);text-align:center;padding:60px 10px}
#msg{min-height:1.4em;font-size:14px;color:var(--g);margin:6px 0}
:root[data-theme=dark] #msg{color:#8fd1ae}
.err{color:#e2553f!important}
#pages{display:flex;flex-direction:column;gap:12px}
.pg{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.pg canvas{display:block;width:100%;height:auto}
.hl{position:absolute;background:rgba(255,40,40,.30);outline:2px solid rgba(215,0,0,.85);border-radius:2px;mix-blend-mode:multiply;pointer-events:none}
.hl.w{background:rgba(255,170,0,.32);outline-color:rgba(220,130,0,.9)}
.hl.flash{animation:fl .9s 2}
@keyframes fl{50%{background:rgba(255,40,40,.7)}}
.nohl .hl{display:none}
.audit{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:light-dark(#fff,#151a17)}
.audit h3{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.audit ul{list-style:none;margin:0;padding:0}
.audit li{display:flex;gap:8px;padding:4px 0;font-size:14.5px;cursor:pointer}
.audit li b{flex:none;border-radius:6px;font-size:12px;padding:2px 7px;color:#fff;background:#d7261e;height:fit-content}
.audit li.w b{background:#d99a1e}.audit li.i b{background:#6b7a72}
.audit .okmsg{color:var(--ok);font-weight:700}
.prev{margin-top:8px;padding:8px 10px;border-radius:8px;background:light-dark(#fff4e8,#3a2a19);font-size:14px;white-space:pre-wrap}
#back{display:none}
@media(max-width:900px){#app{grid-template-columns:minmax(0,1fr)}#list{max-height:none}#detail .pdf{height:70vh}
  #app:not(.showd) #detail-wrap{display:none}#app.showd>div:first-child{display:none}
  #back{display:inline-flex;align-items:center;margin-bottom:10px}
  #detail{padding:12px}main{padding:12px 10px 60px}
  .dec .btn{font-size:15px;padding:8px 14px;min-height:46px}}
</style>
</head>
<body>
<header><h1>담임 검토 · 정왕고 체험학습 작성기</h1><span id="who"></span></header>
<main>
  <section id="login" class="card">
    <h2 style="margin:0 0 10px;font-size:20px">담임 로그인</h2>
    <div class="row"><label>학년<select id="lg"><option>1</option><option>2</option><option selected>3</option></select></label><label>반<input id="lc" inputmode="numeric" placeholder="예: 8"></label></div>
    <label>담임 비밀번호<input id="lp" type="password" autocomplete="current-password"></label>
    <label class="check"><input type="checkbox" id="ladm">관리자(전체 반 보기)</label>
    <button class="btn p" id="bLogin" style="width:100%">로그인</button>
    <p id="lmsg" style="font-size:14px;min-height:1.4em"></p>
    <p style="font-size:13px;color:var(--mute);margin:0">비밀번호는 검토 시트 '설정' 탭에 반별로 적어 둔 것입니다.</p>
  </section>
  <section id="app" hidden>
    <div>
      <div class="tools" id="filters"></div>
      <div class="tools"><button id="bRefresh">새로고침</button><button id="bLogout">로그아웃</button></div>
      <div id="msg"></div>
      <div id="list"></div>
    </div>
    <div id="detail-wrap"><button class="btn" id="back" type="button">← 목록으로</button><div id="detail" class="card"><p class="empty">왼쪽 목록에서 학생의 요청을 고르세요.</p></div></div>
  </section>
</main>
<script src="config.js"></script>
<script src="spec.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
{
const API=(window.JW_API||'').trim();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cred=null,items=[],cur=null,filter='대기',pdfUrl='',curData={},pdfBytes=null,lastAudit=null,pageEls=[];
const say=(m,bad)=>{$('#msg').textContent=m;$('#msg').classList.toggle('err',!!bad)};
async function api(o){
  if(!API)throw new Error('검토 서버 주소(config.js)가 설정되지 않았습니다.');
  const r=await fetch(API,{method:'POST',body:JSON.stringify(o)});const j=await r.json();if(!j.ok)throw new Error(j.msg||'요청 실패');return j;
}
const badge=s=>`<span class="badge ${s==='승인'?'ok':s==='보완 요청'?'fix':''}">${esc(s)}</span>`;
const FIL=[['대기','검토 대기',x=>/대기/.test(x.status)],['보완','보완 요청',x=>x.status==='보완 요청'],['승인','승인',x=>x.status==='승인'],['전체','전체',()=>true]];
function drawFilters(){
  $('#filters').innerHTML=FIL.map(([k,l,f])=>`<button data-f="${k}" class="${filter===k?'on':''}">${l} ${items.filter(f).length}</button>`).join('');
}
function drawList(){
  drawFilters();
  const f=FIL.find(x=>x[0]===filter)[2],L=items.filter(f);
  $('#list').innerHTML=L.length?L.map(x=>`<button class="it ${cur&&cur.id===x.id?'on':''}" data-id="${esc(x.id)}"><div class="t"><b>${esc(x.grade)}-${esc(x.cls)} ${esc(x.num)}번 ${esc(x.name)}</b>${badge(x.status)}</div>
    <div class="s">${esc(x.doc)} · ${esc(x.period)}${x.dest?` · ${esc(x.dest)}`:''}</div><div class="s">요청 ${esc(x.at)}${x.count>1?` (${esc(x.count)}번째)`:''}</div></button>`).join('')
    :'<p class="empty">해당하는 요청이 없어요.</p>';
}
async function load(){
  say('불러오는 중…');
  try{const j=await api({action:'tlist',...cred});items=j.list;$('#who').textContent=j.who;drawList();say(`요청 ${items.length}건`)}
  catch(e){say(e.message,true)}
}
async function open(id){
  cur=items.find(x=>x.id===id);drawList();$('#app').classList.add('showd');window.scrollTo(0,0);
  $('#detail').innerHTML='<p class="empty">서류를 불러오는 중…</p>';
  try{
    const j=await api({action:'tget',...cred,id});cur=j.item;
    if(pdfUrl)URL.revokeObjectURL(pdfUrl);pdfUrl='';
    if(j.pdf){const b=Uint8Array.from(atob(j.pdf),c=>c.charCodeAt(0));pdfUrl=URL.createObjectURL(new Blob([b],{type:'application/pdf'}))}
    const fn=`${cur.doc}_${cur.grade}-${cur.cls}-${cur.num}_${cur.name}.pdf`;
    $('#detail').innerHTML=`<div class="head"><div><h2>${esc(cur.grade)}-${esc(cur.cls)} ${esc(cur.num)}번 ${esc(cur.name)} · ${esc(cur.doc)}</h2>
      <div style="font-size:14px;color:var(--mute)">${esc(cur.period)}${cur.dest?` · ${esc(cur.dest)}`:''} · 요청 ${esc(cur.at)}</div></div><div class="topdec">${badge(cur.status)}<button class="btn ok" id="bOk2">✔ 승인</button><button class="btn fix" id="bFix2">보완 요청 쓰기</button></div></div>
      <div class="audit" id="audit"><h3>🖍 자동 점검 <span><button class="btn" id="bAudit" style="min-height:36px;padding:4px 10px">다시 점검</button> <button class="btn" id="bHl" style="min-height:36px;padding:4px 10px">형광펜 끄기</button></span></h3><div id="auditBody">점검하는 중…</div></div>
      <div id="pages">${pdfUrl?'':'<p class="empty">PDF를 찾을 수 없어요.</p>'}</div>
      ${pdfUrl?`<div class="tools" style="margin-top:8px"><a class="btn" href="${pdfUrl}" target="_blank" rel="noopener">PDF 새 창에서 보기</a><a class="btn" href="${pdfUrl}" download="${esc(fn)}">PDF 내려받기</a></div>`:''}
      ${cur.comment?`<div class="prev"><b>이전에 보낸 보완 사항</b>\n${esc(cur.comment)}</div>`:''}
      <label style="margin-top:12px">보완 사항 (보완 요청할 때 필수, 승인할 때는 선택)<textarea id="cm" placeholder="예) 2일차 학습계획을 구체적으로 적어 주세요. 보호자 서명이 빠졌어요."></textarea></label>
      <div class="dec"><button class="btn" id="bPut">점검 결과를 보완 사항에 넣기</button><button class="btn ok" id="bOk">✔ 승인</button><button class="btn fix" id="bFix">보완 요청 보내기</button></div>`;
    curData=j.data||{};pdfBytes=j.pdf?Uint8Array.from(atob(j.pdf),c=>c.charCodeAt(0)):null;
    $('#bAudit').onclick=()=>runAudit();
    $('#bHl').onclick=e=>{const off=$('#pages').classList.toggle('nohl');e.target.textContent=off?'형광펜 켜기':'형광펜 끄기'};
    $('#bPut').onclick=()=>{const L=(lastAudit||[]).filter(x=>x.lv!=='i');if(!L.length){say('넣을 점검 항목이 없어요.');return}
      const t=L.map((x,i)=>`${i+1}. ${x.m}`).join('\n');$('#cm').value=($('#cm').value.trim()?$('#cm').value.trim()+'\n':'')+t;$('#cm').focus()};
    await drawPages();runAudit();
    $('#bOk2').onclick=()=>review('승인');$('#bFix2').onclick=()=>{$('#cm').scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>$('#cm').focus({preventScroll:true}),300)};
    $('#bOk').onclick=()=>review('승인');$('#bFix').onclick=()=>review('보완 요청');
  }catch(e){$('#detail').innerHTML=`<p class="empty err">${esc(e.message)}</p>`}
}

/* ── 자동 점검: 학생 입력값(데이터)과 PDF 화면을 함께 확인해 빈칸·오류 위치에 형광펜 ── */
const SPEC=window.JW_SPEC||{F:[],OPT:{}},HOLI=window.JW_HOLI||[],MUST=window.JW_MUST||{};
const FM={};SPEC.F.forEach(f=>FM[f.k]=f);
const WD='일월화수목금토';
const pd=s=>{if(!s)return null;const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],m[2]-1,+m[3]):null};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const key=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
const md=x=>`${x.getMonth()+1}/${x.getDate()}`;
const school=x=>x.getDay()%6!==0&&!HOLI.includes(key(x));
const wdBetween=(a,b)=>{let c=0;for(let x=a;x<b;x=addD(x,1))if(school(x))c++;return c};
const TEL=/^01[016789]-\d{3,4}-\d{4}$/;
function rectOf(k){
  const f=FM[k];if(!f)return null;if(f.kind==='photo')return f.box;
  if(['appPn','appSn','repPn','repSn'].includes(k)||f.kind==='tick'||f.kind==='sig')return [f.x-2,f.top-2,2*f.cx-f.x+2,f.top+f.h+2];
  if(f.a==='l'||f.a==='j')return [f.x-1,f.top-1,f.R-1.5,f.top+f.h+1];
  return [f.L+1.5,f.top-1,f.R-1.5,f.top+f.h+1];
}
function optRect(p){const o=Object.values(SPEC.OPT[p]||{});if(!o.length)return null;const xs=o.map(v=>v[0]);return [Math.min(...xs)-82,o[0][1]-1,Math.max(...xs)+10,o[0][1]+o[0][2]+1]}
function audit(d,item){
  const R=[],E=(m,ks)=>R.push({lv:'e',m,ks:[].concat(ks||[])}),W=(m,ks)=>R.push({lv:'w',m,ks:[].concat(ks||[])}),I=(m,ks)=>R.push({lv:'i',m,ks:[].concat(ks||[])});
  const app=item.doc!=='결과보고서',P=app?0:1,half=d.type==='half';
  const K=app?{name:'name',cls:'cls',period:'period',half:'half',dest:'dest',date:'appDate',pn:'appPn',sn:'appSn',ps:'appP',ss:'appS'}:{name:'r_name',cls:'r_cls',period:'r_period',half:'r_half',dest:'r_dest',date:'repDate',pn:'repPn',sn:'repSn',ps:'repP',ss:'repS'};
  const s=pd(half?d.hdate:d.start),e=pd(half?d.hdate:d.end);
  const cal=[];if(s&&e)for(let x=s;x<=e&&cal.length<40;x=addD(x,1))cal.push(x);
  const rows=cal.filter(school);
  if(!d.name)E('학생 성명이 비어 있어요',K.name);
  if(!d.cls||!d.num)E('반·번호가 비어 있어요',K.cls);
  if(half){if(!s)E('반일 사용 날짜가 없어요',K.half);else if(!school(s))E(`반일 날짜 ${md(s)}(${WD[s.getDay()]})는 수업일이 아니에요`,K.half)}
  else{
    if(!s||!e)E('체험학습 기간(시작·종료일)이 비어 있어요',K.period);
    else{
      if(e<s)E('종료일이 시작일보다 빨라요',K.period);
      if(s.getDay()%6===0)W(`시작일 ${md(s)}이 주말이에요`,K.period);
      if(e.getDay()%6===0)W(`종료일 ${md(e)}이 주말이에요`,K.period);
    }
  }
  const mi=(half?(s?[s]:[]):cal).filter(x=>MUST[key(x)]);
  if(mi.length)W(`필수 출석일 포함: ${mi.map(x=>`${md(x)}(${WD[x.getDay()]}) ${MUST[key(x)]}`).join(', ')}`,half?K.half:K.period);
  if(!d.form)E('학습형태가 선택되지 않았어요','@opt');
  if(!d.dest)E('목적지가 비어 있어요',K.dest);
  if(app){
    if(!d.phone)E('학생 휴대폰이 비어 있어요','phone');else if(!TEL.test(d.phone))E('학생 휴대폰 번호 형식이 이상해요','phone');
    const n=parseFloat(d.days),cum=parseFloat(d.cum);
    if(isNaN(n)||n<=0)E('출석 인정 신청일수가 비어 있어요','days');
    else{
      const sd=half?0.5:rows.length;
      if(!half&&s&&e&&n!==sd)(n>sd?E:W)(`신청일수 ${n}일 ↔ 기간의 수업일 ${sd}일이 달라요`,['days',K.period]);
      if(half&&n!==0.5)W('반일 단위인데 신청일수가 0.5일이 아니에요','days');
      if(n>20)E('신청일수가 연간 20일을 넘어요','days');
    }
    if(isNaN(cum))W('누적 사용기간이 비어 있어요','cum');
    else{if(!isNaN(n)&&cum<n)E(`누적 사용기간(${cum}일)이 이번 신청일수(${n}일)보다 작아요`,'cum');if(cum>20)E(`누적 사용기간이 ${cum}일로 연간 20일을 넘어요`,'cum')}
    if(cal.length>1&&!d.lodge)W('1박 이상인데 숙박장소가 비어 있어요','lodge');
    if(!d.gName)E('보호자명이 비어 있어요','gName');if(!d.gRel)E('보호자 관계가 비어 있어요','gRel');
    if(!d.gPhone)E('보호자 휴대폰이 비어 있어요','gPhone');else if(!TEL.test(d.gPhone))E('보호자 휴대폰 번호 형식이 이상해요','gPhone');
    if(!d.lName)E('인솔자명이 비어 있어요','lName');if(!d.lRel)E('인솔자 관계가 비어 있어요','lRel');
    if(!d.lPhone)E('인솔자 휴대폰이 비어 있어요','lPhone');else if(!TEL.test(d.lPhone))E('인솔자 휴대폰 번호 형식이 이상해요','lPhone');
    if(!d.purpose)E('목적이 비어 있어요','purpose');
    const pl=d.plans||[];
    rows.slice(0,5).forEach((x,i)=>{if(!(pl[i]||'').trim())E(`${i+1}일차(${md(x)}) 학습계획이 비어 있어요`,['pl'+i,'pd'+i])});
    if(rows.length>5)W(`수업일이 ${rows.length}일이라 양식 계획란(5칸)을 넘어요`,K.period);
    if(!d.c1)E('세부 규칙·불허기간 확인에 체크하지 않았어요');
    if(half&&!(d.c2&&d.c3))E('반일 단위 확인 항목에 체크하지 않았어요',K.half);
    if(cal.length>=5&&!d.safe)E('5일 이상 연속인데 학생안전 동의가 없어요');
    const ad=pd(d.appDate);if(!ad)E('작성일이 비어 있어요',K.date);else if(s&&ad>s)E('작성일이 체험학습 시작일보다 늦어요',K.date);
    const rq=pd(item.at);if(rq&&s){const c=wdBetween(rq,s);if(c<4)W(`제출 기한 초과 가능: 요청일(${md(rq)})부터 시작일까지 수업일 ${c}일 (기준 4일 전)`,K.period)}
    pl.forEach((v,i)=>i<5&&window.JW_typos&&window.JW_typos(v).forEach(m=>I(`[오타] ${i+1}일차 계획: ${m}`,'pl'+i)));
  }else{
    if(!(d.title||d.purpose))E('제목이 비어 있어요','r_title');
    if(!(d.comp||d.gName))W('보호자(동반자)가 비어 있어요','r_comp');
    const rp=d.reps||[];
    rows.slice(0,5).forEach((x,i)=>{const v=(rp[i]||'').trim(),ks=[0,1,2,3].map(j=>`rl${i}_${j}`);
      if(!v)E(`${i+1}일차(${md(x)}) 결과 내용이 비어 있어요`,ks);
      else if(v.replace(/\s/g,'').length<110)W(`${i+1}일차(${md(x)}) 분량이 적어요(1일 4줄 기준)`,ks);
      window.JW_typos&&window.JW_typos(v).forEach(m=>I(`[오타] ${i+1}일차: ${m}`,ks[0]));});
    const rd=pd(d.repDate);if(!rd)E('작성일이 비어 있어요',K.date);else if(e&&rd<e)E('작성일이 체험학습 종료일보다 빨라요',K.date);
    const rq=pd(item.at);if(rq&&e){const c=wdBetween(addD(e,1),addD(rq,1));if(c>7)W(`보고서 제출 기한 초과 가능: 종료 후 수업일 ${c}일 (기준 7일 이내)`,K.date)}
  }
  if(!d.name)E('학생 서명란 이름이 비어 있어요',K.sn);
  if(!d.gName)E('보호자 서명란 이름이 비어 있어요',K.pn);
  return {R,P,rows};
}
async function drawPages(){
  pageEls=[];const box=$('#pages');if(!pdfBytes||!box)return;
  if(!window.pdfjsLib){box.innerHTML=`<iframe class="pdf" src="${pdfUrl}" title="학생이 보낸 서류" style="width:100%;height:78vh;border:0"></iframe>`;return}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:pdfBytes.slice()}).promise;box.innerHTML='';
  for(let i=1;i<=doc.numPages;i++){
    const page=await doc.getPage(i),vp0=page.getViewport({scale:1}),sc=Math.min(2.2,Math.max(1.2,(box.clientWidth||800)*(devicePixelRatio||1)/vp0.width));
    const vp=page.getViewport({scale:sc}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    const w=document.createElement('div');w.className='pg';w.append(c);box.append(w);pageEls.push({w,c,vp0});
  }
}
function runAudit(){
  if(!cur)return;
  const {R,P,rows}=audit(curData||{},cur);
  // 서명(이름 아래위로 그은 선이 있는지)·사진(칸이 비었는지) 확인
  const pg0=cur.doc==='결과보고서'?1:0;
  const D=curData||{},app=cur.doc!=='결과보고서';
  if(D._sig){[[app?'appP':'repP','보호자'],[app?'appS':'repS','학생']].forEach(([k,l])=>{if(!D._sig[k])R.push({lv:'e',m:`${l} 서명이 없어요`,ks:[k]})})}
  else R.push({lv:'i',m:'서명은 PDF에서 직접 확인하세요',ks:[]});
  if(!app&&D._ph)rows.slice(0,5).forEach((x,i)=>{if(!D._ph[i])R.push({lv:'w',m:`${md(x)} 활동사진이 없어요(1일 1사진)`,ks:['ph'+i]})});
  lastAudit=R;
  // 형광펜
  document.querySelectorAll('.hl').forEach(h=>h.remove());
  R.forEach((r,ri)=>r.ks.forEach(k=>{
    const rect=k==='@opt'?optRect(P):rectOf(k);if(!rect)return;
    const fp=k==='@opt'?P:(FM[k]?FM[k].p:P);const idx=fp-pg0;const pe=pageEls[idx];if(!pe)return;
    const h=document.createElement('div');h.className='hl'+(r.lv==='e'?'':' w');h.dataset.ri=ri;
    Object.assign(h.style,{left:rect[0]/595.28*100+'%',top:rect[1]/841.89*100+'%',width:(rect[2]-rect[0])/595.28*100+'%',height:(rect[3]-rect[1])/841.89*100+'%'});
    pe.w.append(h);}));
  const ne=R.filter(r=>r.lv==='e').length,nw=R.filter(r=>r.lv==='w').length,ni=R.length-ne-nw;
  $('#auditBody').innerHTML=!R.length?'<p class="okmsg">자동 점검에서 걸린 항목이 없어요. 서명·내용만 눈으로 확인하고 승인하세요.</p>'
    :`<p style="margin:0 0 6px;font-size:14px">오류 <b style="color:#d7261e">${ne}</b> · 확인 <b style="color:#d99a1e">${nw}</b>${ni?` · 참고 ${ni}`:''} <span style="color:var(--mute)">(항목을 누르면 해당 위치로 이동)</span></p><ul>${R.map((r,i)=>`<li class="${r.lv}" data-ri="${i}"><b>${r.lv==='e'?'오류':r.lv==='w'?'확인':'참고'}</b><span>${esc(r.m)}</span></li>`).join('')}</ul>`;
}
document.addEventListener('click',e=>{const li=e.target.closest('.audit li[data-ri]');if(!li)return;const h=document.querySelector(`.hl[data-ri="${li.dataset.ri}"]`);if(h){$('#pages').classList.remove('nohl');h.scrollIntoView({behavior:'smooth',block:'center'});h.classList.remove('flash');void h.offsetWidth;h.classList.add('flash')}});
async function review(st){
  const cm=$('#cm').value.trim();
  if(st==='보완 요청'&&!cm){$('#cm').focus();say('보완할 내용을 적어 주세요.',true);return}
  $('#bOk').disabled=$('#bFix').disabled=$('#bOk2').disabled=true;say('저장하는 중…');
  try{await api({action:'treview',...cred,id:cur.id,status:st,comment:cm});const id=cur.id,nm=cur.name;await load();await open(id);say(`${nm} 학생: ${st} 처리했어요. 학생이 앱의 [내 검토 현황]에서 확인합니다.`)}
  catch(e){say(e.message,true);$('#bOk').disabled=$('#bFix').disabled=false}
}
$('#filters').addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;drawList()}});
$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)open(b.dataset.id)});
$('#bRefresh').onclick=load;
$('#back').onclick=()=>{$('#app').classList.remove('showd');window.scrollTo(0,0)};
$('#bLogout').onclick=()=>{try{sessionStorage.removeItem('jw-t')}catch(e){}location.reload()};
$('#ladm').onchange=e=>{$('#lg').disabled=$('#lc').disabled=e.target.checked};
async function login(c){
  $('#lmsg').textContent='확인하는 중…';$('#lmsg').className='';
  try{const j=await api({action:'tlist',...c});cred=c;try{sessionStorage.setItem('jw-t',JSON.stringify(c))}catch(e){}
    $('#login').hidden=true;$('#app').hidden=false;items=j.list;$('#who').textContent=j.who;drawList();say(`요청 ${items.length}건`)}
  catch(e){$('#lmsg').textContent=e.message;$('#lmsg').className='err';$('#login').hidden=false;$('#app').hidden=true}
}
$('#bLogin').onclick=()=>{const adm=$('#ladm').checked;login({grade:adm?'*':$('#lg').value,cls:adm?'*':$('#lc').value.trim(),tpw:$('#lp').value})};
$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')$('#bLogin').click()});
try{const c=JSON.parse(sessionStorage.getItem('jw-t')||'null');if(c)login(c)}catch(e){}
if(!API){$('#lmsg').textContent='검토 서버 주소가 아직 설정되지 않았습니다(config.js).';$('#lmsg').className='err'}
}
</script>
